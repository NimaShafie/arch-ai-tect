<!-- server/templates/base.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}ArchAiTect Workbench{% endblock %}</title>

  <!-- Favicon (ICO preferred; SVG fallback) -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

  <style>
    :root{
      --md-primary:#2563eb;        /* blue-600 */
      --md-primary-ink:#1e4fd6;    /* hover/darker */
      --muted:#64748b;             /* slate-500 */
      --bg:#f8fafc;                /* slate-50 */
      --card:#ffffff;
      --border:#e5e7eb;
      --ring: rgba(37, 99, 235, .25);
      --shadow: 0 10px 20px rgba(2,6,23,.06), 0 2px 6px rgba(2,6,23,.08);

      --btn-h: 42px;
      --btn-pad-x: 14px;
      --radius: 14px;

      --toast-size: 1.2rem;
    }

    *{ box-sizing:border-box }
    html,body{ height:100% }
    html{ scroll-behavior:smooth }

    body{
      margin:0;
      font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background:var(--bg);
      color:#0f172a;
    }

    a{ color:var(--md-primary); text-decoration:none }
    a:hover{ color:var(--md-primary-ink) }
    code{
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      background:#f1f5f9; padding:2px 6px; border-radius:6px
    }

    .container{ max-width:1200px; margin:0 auto; padding:24px }
    .nav{ display:flex; align-items:center; justify-content:space-between; padding:12px 0 }
    .brand{ font-weight:700; letter-spacing:.2px }
    .nav-links{ display:flex; gap:12px; align-items:center; flex-wrap:wrap }

    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#eef2ff; color:#3730a3;
      font-weight:600; font-size:14px;
      border:1px solid #e9e5ff;
    }

    .btn{
      appearance:none; border:1px solid var(--border); background:var(--card);
      height:var(--btn-h);
      padding:0 var(--btn-pad-x);
      border-radius:var(--radius); cursor:pointer;
      box-shadow:0 1px 0 rgba(0,0,0,.02);
      display:inline-flex; align-items:center; justify-content:center;
      font-weight:600;
    }
    .btn.primary{
      background:var(--md-primary); border-color:transparent; color:#fff;
      box-shadow:0 0 0 0 var(--ring);
      transition:box-shadow .15s ease, background .15s ease;
    }
    .btn.primary:hover{ background:var(--md-primary-ink) }
    .btn:focus{ outline:none; box-shadow:0 0 0 4px var(--ring) }

    .grid{ display:grid; gap:24px; grid-template-columns:1.05fr .95fr }
    .stack{ display:flex; flex-direction:column }
    .row{ display:flex; gap:12px; flex-wrap:wrap }

    .card{
      background:var(--card); border:1px solid var(--border); border-radius:16px;
      box-shadow:var(--shadow);
    }
    .card .hd{ padding:18px 20px; border-bottom:1px solid var(--border); font-weight:700 }
    .card .bd{ padding:20px }
    .muted{ color:var(--muted) }

    .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px }

    .json-textarea{
      width:100%;
      padding:12px 12px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#0b1020;
      color:#e6edf3;
      font: 14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      min-height: 240px;
      white-space:pre; overflow:auto;
    }
    .json-textarea:focus{ outline:none; box-shadow:0 0 0 4px var(--ring); border-color:transparent }

    .toast-wrap{
      position:fixed; right:16px; top:16px; z-index:9999;
      display:flex; flex-direction:column; gap:10px; pointer-events:none;
    }
    .toast{
      pointer-events:auto;
      background:#111827; color:#fff;
      border:1px solid #000;
      border-radius:12px;
      padding:12px 16px;
      min-width: 260px;
      font-size: var(--toast-size);
      box-shadow: 0 10px 20px rgba(2,6,23,.25), 0 2px 6px rgba(2,6,23,.2);
      opacity:0; transform: translateY(-6px); transition: all .18s ease;
    }
    .toast.show{ opacity:1; transform: translateY(0) }
    .toast.success{ background:#065f46 }
    .toast.error{ background:#7f1d1d }

    .card > h1, .card > h2, .card > h3{
      margin:0; padding:18px 20px; border-bottom:1px solid var(--border);
      border-top-left-radius:16px; border-top-right-radius:16px;
    }
    .card > :not(.hd):not(h1):not(h2):not(h3):first-of-type{
      padding-top:16px; padding-left:20px; padding-right:20px;
    }
    .card > :not(.hd):last-child{ padding-bottom:20px }

    /* Extra spacing for form rows (labels vs inputs) */
    .form-row{ display:flex; flex-direction:column; gap:10px; margin:14px 0; }
    .input{
      width:100%; padding:14px 16px; border:1px solid var(--border);
      border-radius:12px;
      background:#fff; color:#0f172a;
      font-size:16px;
    }

    @media (max-width:980px){
      .grid{ grid-template-columns:1fr }
    }

    /* ── Sticky footer layout ───────────────────────────────────────── */
    body{
      display:flex; flex-direction:column; min-height:100vh;
    }
    .container{
      flex:1;
    }
    .site-footer{
      margin-top:auto;
      border-top:1px solid var(--border);
      background:var(--card);
      padding:18px 24px;
    }
    .site-footer .footer-inner{
      max-width:1200px; margin:0 auto;
      display:flex; align-items:center; justify-content:space-between;
      flex-wrap:wrap; gap:8px;
      font-size:.825rem; color:var(--muted);
    }
    .site-footer a{ color:var(--muted); text-decoration:underline; text-underline-offset:2px; }
    .site-footer a:hover{ color:var(--md-primary); }
  </style>

  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/assets/favicon.svg">

  <script>
    function showToast(msg, type='success', timeout=2600){
      const wrap = document.querySelector('.toast-wrap') || (()=>{
        const w = document.createElement('div'); w.className='toast-wrap'; document.body.appendChild(w); return w;
      })();
      const t = document.createElement('div');
      t.className = 'toast ' + (type || '');
      t.textContent = msg;
      wrap.appendChild(t);
      requestAnimationFrame(()=> t.classList.add('show'));
      setTimeout(()=>{
        t.classList.remove('show');
        setTimeout(()=> t.remove(), 200);
      }, timeout);
    }
  </script>

  {% block head %}{% endblock %}
</head>
<body>
  <div class="container">
    <nav class="nav">
      <div class="brand">ArchAiTect Workbench</div>
      <div class="nav-links">
        <!-- Removed "New Project"; all remaining open in new tabs -->
        <a class="pill" href="https://workbench.shafie.org/" rel="noopener">Workbench</a>
        <a class="pill" href="https://docs.shafie.org/" target="_blank" rel="noopener">Docs</a>
        <a class="pill" href="/docs" target="_blank" rel="noopener">Swagger</a>
        <a class="pill" href="https://ai.shafie.org/" target="_blank" rel="noopener">Open WebUI</a>
      </div>
    </nav>

    {% block content %}{% endblock %}
  </div>

  <div class="toast-wrap" aria-live="polite"></div>

  {% block scripts %}{% endblock %}

  <footer class="site-footer">
    <div class="footer-inner">
      <span>&copy; 2026 ArchAiTect Workbench</span>
      <span>Made by <a href="https://github.com/NimaShafie" target="_blank" rel="noopener">Nima Shafie</a></span>
    </div>
  </footer>
</body>
</html>
