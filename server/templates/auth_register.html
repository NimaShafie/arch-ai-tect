{% extends "base.html" %}
{% block title %}Register · ArchAiTect{% endblock %}
{% block content %}
<section class="card" style="max-width:720px;margin:0 auto">
  <h1>Register</h1>
  {% if error %}<p class="muted" style="color:#c23030">{{ error }}</p>{% endif %}
  <form method="post" class="stack" style="margin-top:12px">
    <div class="field"><label>Display name</label><input name="display_name" type="text" required /></div>
    <div class="field"><label>Email</label><input name="email" type="email" required /></div>
    <div class="field"><label>Password</label><input name="password" type="password" required /></div>
    <div class="row"><button class="btn btn-primary" type="submit">Create account</button></div>
  </form>
</section>
{% endblock %}
