services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports: ["${OLLAMA_PORT:-11434}:11434"]
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_THREADS=8
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_FLASH_ATTENTION=false
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks: [proxy]

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: ["/bin/sh","-lc"]
    command: |
      set -e
      ollama pull qwen2.5:3b || true
      ollama rm qwen3:8b || true
      echo "Model setup complete."
    restart: "no"
    networks: [proxy]

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    environment:
      - WEBUI_AUTH=True
      - WEBUI_URL=https://ai.shafie.org
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_MULTI_USER=true
      - DEFAULT_MODELS=qwen2.5:3b
      - OLLAMA_KEEP_ALIVE=1h
      - WEBUI_AUTH_TRUSTED_NAME_HEADER=cf-access-authenticated-user-email
      - WEBUI_AUTH_TRUSTED_EMAIL_HEADER=cf-access-authenticated-user-email
      - DEFAULT_USER_ROLE=user
      - ENABLE_PERSISTENT_CONFIG=True
    ports: ["${OPENWEBUI_PORT:-3001}:8080"]
    volumes:
      - openwebui_data:/app/backend/data
      - openwebui_cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/config >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [proxy]

  docs:
    build:
      context: ..
      dockerfile: compose/docs/Dockerfile
    pull_policy: never
    image: local/mkdocs-material-with-plugins:latest
    container_name: docs
    restart: unless-stopped
    working_dir: /work
    command:
      - sh
      - -lc
      - >
        python3 server/services/run_build_nav.py &&
        mkdocs serve -a 0.0.0.0:8080 --no-strict --dirtyreload
        --watch /work/docs
        --watch /work/mkdocs.yml
        --watch /work/server/services
    environment:
      - XDG_CACHE_HOME=/var/mkdocs/cache
      - PYTHONPATH=/work
    volumes:
      - ../:/work:rw
      - docs_cache:/var/mkdocs/cache
    networks: [proxy]

  kroki:
    image: yuzutech/kroki:latest
    container_name: kroki
    restart: unless-stopped
    networks: [proxy]

  plantuml:
    image: plantuml/plantuml-server:jetty
    container_name: plantuml
    restart: unless-stopped
    ports: ["${PLANTUML_PORT:-18080}:8080"]
    networks: [proxy]

  webhook:
    image: node:20-alpine
    container_name: webhook
    working_dir: /opt/auto-deploy
    volumes:
      - /opt/auto-deploy:/opt/auto-deploy:ro
    command: ["node", "webhook.js"]
    environment:
      - PORT=9000
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    depends_on:
      cloudflared:
        condition: service_started
    profiles: ["tunnel"]
    networks: [proxy]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      docs:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["tunnel"]
    networks: [proxy]

volumes:
  ollama_models: {}
  openwebui_data: {}
  openwebui_cache: {}
  docs_cache: {}

networks:
  proxy:
    external: true
